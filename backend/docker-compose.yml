services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL_DOCKER}"
      - "up"
    restart: "no"

  rbac-seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: vera-backend:local
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    entrypoint: ["/seed-rbac"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vera-backend:local
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      rbac-seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
